<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compresso</title>

  <!-- External libraries for ZIP and HEIC decoding -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <!-- Ultra-Clean Minimal Apple Design -->
  <style>
    :root {
      --bg: #FBFBFD;
      --surface: #FFFFFF;
      --surface-muted: #F5F5F7;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text: #1D1D1F;
      --text-secondary: #86868B;
      --blue: #0071E3;
      --blue-hover: #0077ED;
      --blue-light: #F0F6FF;
      --blue-border: #CCE1FF;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
      --shadow-float: 0 20px 40px -15px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      --radius-lg: 24px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.5;
    }

    /* Minimal Header */
    header {
      width: 100%;
      max-width: 680px;
      padding: 32px 24px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 680px;
      padding: 20px 24px 100px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Hero Text */
    .hero {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text);
    }

    .hero p {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Minimalist Drop Zone */
    .drop-zone {
      background: var(--surface);
      border: 1.5px dashed rgba(0, 0, 0, 0.12);
      border-radius: var(--radius-lg);
      padding: 56px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .drop-zone:hover {
      border-color: var(--blue);
      background: var(--blue-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .drop-icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--blue-light);
      border: 1px solid var(--blue-border);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .drop-zone:hover .drop-icon-wrapper {
      transform: scale(1.08);
    }

    .drop-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.015em;
    }

    .drop-title span {
      color: var(--blue);
    }

    .drop-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Results Section */
    .results-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .results-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-badge {
      font-size: 11px;
      background: var(--surface-muted);
      color: var(--text-secondary);
      padding: 1px 8px;
      border-radius: 999px;
      font-family: monospace;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: color 0.15s ease;
      font-family: inherit;
    }

    .clear-btn:hover {
      color: var(--text);
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .thumb-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-meta {
      min-width: 0;
    }

    .result-filename {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .result-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .saved-pill {
      background: var(--blue-light);
      color: var(--blue);
      border: 1px solid var(--blue-border);
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .save-button {
      background: var(--surface-muted);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .save-button:hover {
      background: var(--blue);
      color: #FFFFFF;
      border-color: var(--blue);
    }

    .save-button:active {
      transform: scale(0.96);
    }

    /* Floating Dynamic Bottom Bar */
    .floating-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 100px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 40;
      width: calc(100% - 48px);
      max-width: 520px;
    }

    .floating-bar.visible {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .floating-bar-inner {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;
      padding: 12px 18px;
      box-shadow: var(--shadow-float);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .floating-stats {
      font-size: 12px;
      font-family: monospace;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .floating-stats strong {
      color: var(--text);
    }

    .zip-btn {
      background: var(--blue);
      color: #FFFFFF;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 3px rgba(0, 113, 227, 0.3);
      transition: all 0.15s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .zip-btn:hover {
      background: var(--blue-hover);
    }

    .zip-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header>
    <a href="#" class="brand">
      <div class="brand-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </div>
      <span class="brand-name">Compresso</span>
    </a>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Clean Headline -->
    <div class="hero">
      <h1>Compress images.</h1>
      <p>Drop photos here to shrink up to 95% in AVIF. Fast, private, in-browser.</p>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" class="drop-zone">
      <div class="drop-icon-wrapper">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <div>
        <div class="drop-title">Drop photos here, or <span>browse</span></div>
        <div class="drop-subtitle">iPhone HEIC, JPEG, PNG, WebP</div>
      </div>
      <input type="file" id="filePicker" multiple accept="image/*,.heic,.heif" style="display: none;">
    </div>

    <!-- Results Section (Visible only when photos are added) -->
    <div id="resultsWrapper" class="results-wrapper" style="display: none;">
      <div class="results-header">
        <div class="results-title">
          <span>Processed Images</span>
          <span id="processedBadge" class="count-badge">0</span>
        </div>
        <button id="clearAllBtn" class="clear-btn">Clear All</button>
      </div>

      <div id="resultsList" class="results-list"></div>
    </div>

  </main>

  <!-- Floating Dynamic Island Action Bar -->
  <div id="floatingBar" class="floating-bar">
    <div class="floating-bar-inner">
      <div class="floating-stats">
        <span id="statBefore">0 MB</span>
        <span>→</span>
        <strong id="statAfter">0 MB</strong>
        <span id="statSaved" class="saved-pill">0%</span>
      </div>

      <button id="downloadZipBtn" class="zip-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download All (.zip)</span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
