<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compresso</title>

  <!-- External libraries for ZIP and HEIC decoding with auto-fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>if (typeof JSZip === 'undefined') { document.write('<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"><\\/script>'); }</script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <!-- Ultra-Clean Apple Design System -->
  <style>
    :root {
      --bg: #FBFBFD;
      --surface: #FFFFFF;
      --surface-muted: #F5F5F7;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --blue: #0071E3;
      --blue-hover: #0077ED;
      --blue-light: #F0F6FF;
      --blue-border: #CCE1FF;
      --green: #34C759;
      --green-light: #E8F8ED;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
      --shadow-float: 0 20px 40px -15px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.5;
    }

    /* Minimal Header */
    header {
      width: 100%;
      max-width: 680px;
      padding: 32px 24px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 680px;
      padding: 20px 24px 100px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Hero Text */
    .hero {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text);
    }

    .hero p {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Minimalist Drop Zone */
    .drop-zone {
      background: var(--surface);
      border: 1.5px dashed rgba(0, 0, 0, 0.12);
      border-radius: var(--radius-lg);
      padding: 56px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .drop-zone:hover {
      border-color: var(--blue);
      background: var(--blue-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .drop-icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--blue-light);
      border: 1px solid var(--blue-border);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .drop-zone:hover .drop-icon-wrapper {
      transform: scale(1.08);
    }

    .drop-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.015em;
    }

    .drop-title span {
      color: var(--blue);
    }

    .drop-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Batches Container */
    .batches-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }

    /* Batch Card (Clean Apple Section) */
    .batch-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .batch-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .batch-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .batch-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .batch-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .batch-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--blue-light);
      color: var(--blue);
      border: 1px solid var(--blue-border);
      font-family: monospace;
    }

    .batch-badge.completed {
      background: var(--green-light);
      color: var(--green);
      border-color: rgba(52, 199, 89, 0.2);
    }

    /* Smooth Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--blue);
      border-radius: 999px;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
    }

    .progress-fill.completed {
      background: var(--green);
    }

    /* Stats & Action Row */
    .batch-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
    }

    .batch-stats {
      font-size: 12px;
      font-family: monospace;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .batch-stats strong {
      color: var(--text);
    }

    .download-batch-btn {
      background: var(--blue);
      color: #FFFFFF;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 3px rgba(0, 113, 227, 0.25);
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .download-batch-btn:hover:not(:disabled) {
      background: var(--blue-hover);
    }

    .download-batch-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .download-batch-btn:disabled {
      background: var(--surface-muted);
      color: var(--text-tertiary);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Collapsible Preview Thumbnails */
    .batch-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: thin;
    }

    .batch-thumb-item {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      flex-shrink: 0;
    }

    .batch-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header>
    <a href="#" class="brand">
      <div class="brand-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </div>
      <span class="brand-name">Compresso</span>
    </a>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Clean Headline -->
    <div class="hero">
      <h1>Compress images.</h1>
      <p>Drop folders or photos to convert to AVIF. Clean batches, live progress, instant download.</p>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" class="drop-zone">
      <div class="drop-icon-wrapper">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <div>
        <div class="drop-title">Drop folders or photos here, or <span>browse</span></div>
        <div class="drop-subtitle">iPhone HEIC, JPEG, PNG, WebP</div>
      </div>
      <input type="file" id="filePicker" multiple accept="image/*,.heic,.heif" style="display: none;">
    </div>

    <!-- Batches Feed (Each drop gets its own dedicated card) -->
    <div id="batchesContainer" class="batches-container"></div>

  </main>

  <script src="app.js"></script>
</body>
</html>
